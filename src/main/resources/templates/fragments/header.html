<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="topbar">
    <div class="brand">
        <a th:href="@{/}">UTEShop</a>
    </div>
    <nav>
        <a th:href="@{/}">Trang chủ (Ví dụ 2 - Dialect)</a>
        <a th:href="@{/vidu1}">Ví dụ 1 (Không Dialect)</a>
    </nav>
    <div class="account" th:if="${#authorization.expression('isAuthenticated()')}">
        <!-- Avatar -->
        <img th:src="${#authentication.principal.images != null and !#strings.isEmpty(#authentication.principal.images) ? #authentication.principal.images : '/images/avatar-default.png'}"
             alt="Avatar"
             width="40"
             height="40"
             style="border-radius:50%; object-fit:cover; vertical-align:middle; border:2px solid #fff;">
        <!-- Full name -->
        <span th:text="${#authentication.principal.fullName}">Nguyễn Văn A</span>
        <!-- Username -->
        <span th:text="'(' + ${#authentication.principal.username} + ')'" style="color: #93c5fd; font-size: 13px;">(nguyenvana)</span>
        <!-- Email -->
        <span th:text="${#authentication.principal.email}" style="color: #cbd5e1; font-size: 13px;">email@gmail.com</span>
        <!-- Role -->
        <span th:text="${#authentication.principal.role}" class="btn primary small" style="padding: 2px 8px; font-size: 11px;">ROLE_USER</span>
        <!-- Logout -->
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button class="link-button" type="submit">Đăng xuất</button>
        </form>
    </div>
    <div class="account" th:unless="${#authorization.expression('isAuthenticated()')}">
        <a th:href="@{/login}" class="btn primary small">Đăng nhập</a>
    </div>
</header>
</body>
</html>
